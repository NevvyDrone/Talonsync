<!doctype html>
<html lang="en" data-theme="aerie">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalonSync</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-owl"/></svg>
      <div><div class="brand-name">TalonSync</div><div class="brand-sub" id="brand-sub">for Talon Pilot</div></div>
    </div>
    <button class="sync-btn" id="sync-btn" title="TalonSync now (Ctrl+H)">
      <span class="hs-ring"></span>
      <svg class="hs-arrows" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-sync"/></svg>
      <span class="hs-label">TalonSync</span>
    </button>
    <div class="hs-hint" id="hs-hint">Press to sync your PDA</div>
    <nav class="nav" id="nav"></nav>
    <div class="status" id="status"></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <h1 id="view-title">Today</h1>
      <div class="topbar-tools" id="view-tools"></div>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>

<div class="modal-back" id="sync-modal" hidden>
  <div class="sync-win" role="dialog" aria-labelledby="sync-title">
    <div class="sync-title" id="sync-title">TalonSync Progress</div>
    <div class="sync-body">
      <div class="sync-link">
        <svg viewBox="0 0 48 64" class="sync-dev"><use href="#i-pda"/></svg>
        <div class="sync-dots"><i></i><i></i><i></i><i></i><i></i></div>
        <svg viewBox="0 0 64 56" class="sync-pc"><use href="#i-pc"/></svg>
      </div>
      <div class="sync-status" id="sync-status">Connecting with the handheld...</div>
      <div class="bar"><div class="bar-fill" id="sync-bar"></div></div>
      <ol class="sync-stages" id="sync-stages"></ol>
      <div class="sync-summary" id="sync-summary"></div>
    </div>
    <div class="sync-actions"><button class="btn" id="sync-cancel">Cancel</button></div>
  </div>
</div>

<div class="drawer-back" id="drawer-back" hidden></div>
<aside class="drawer" id="drawer" hidden></aside>
<div class="toasts" id="toasts"></div>
